<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Kapable"
>
  <title>Kapable</title>
  <!--
    The Kapable mark: a white angular glyph knocked out of a brand-red disc.
    Two wedges meeting at a point on the left, separated by a red gap, so the
    shape still reads at the ~18px title-bar size.
  -->
  <circle cx="100" cy="100" r="78" fill="#E11D2E" />
  <g fill="#FFFFFF">
    <path d="M64 97 L148 45 L148 95 Z" />
    <path d="M64 103 L148 105 L148 155 Z" />
  </g>
</svg>
